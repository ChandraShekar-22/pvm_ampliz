<ng-template #showUpload>
  <div class="upload-container">
    <section class="upload-area">
      <img src="assets/images/cloud-computing.png" />
      <p>Drag & Drop or <span>Choose file</span> to upload</p>
      <span>CSV</span>
      <input type="file" (change)="onFileUpload($event)" />
    </section>
  </div>
</ng-template>
